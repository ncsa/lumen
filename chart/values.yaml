## Lumen Helm Chart Values
## Full documentation: chart/README.md

# -- Number of Lumen app replicas. ≥2 requires redis for shared rate-limit state.
replicaCount: 1

# -- Number of uvicorn worker processes per pod. Wired to both the
# WEB_CONCURRENCY env var (so lumen/services/db_pool.py:detect_workers() agrees
# with uvicorn on one number) and uvicorn's --workers flag. Values >1 require
# api.prometheus.multiprocDir to be set; the chart then mounts a shared
# emptyDir there so Prometheus can aggregate metrics across processes.
wsgiProcesses: 1

# -- Concurrent requests served per pod (a2wsgi thread pool). Requests beyond
# this queue. Use "auto" to derive it from this pod's connection pool
# (database.poolSize + database.maxOverflow, clamped to 10-64); a number sets it
# directly, in which case keep it at or below that sum or the extra threads just
# block on the pool.
wsgiWorkers: 10

# Seconds a worker thread may wait to hand one response chunk to the server
# before the client is declared gone and the thread reclaimed. This is a stall
# detector for clients that stop reading without closing the connection (a
# half-open TCP link the kernel never abandons), not a QoS limit — leave it well
# above any real client. Keep it below gateway.timeout so a stalled thread is
# freed before the request would have been cut off anyway.
wsgiSendTimeout: 300

# Startup probe for the app container. The budget is periodSeconds x
# failureThreshold (default: 30 minutes) and it has to cover `flask db upgrade`
# **plus** uvicorn startup, not uvicorn alone: entrypoint.sh runs the migrations
# inline before uvicorn binds the port, so /healthz does not answer until they
# finish. Exceed the budget and the kubelet kills the container mid-migration;
# the restart reruns the interrupted revision from the beginning, and a
# migration that reliably outlasts the budget never becomes Ready at all —
# CrashLoopBackOff, and nothing serving wherever there is no older pod still up
# (a fresh install, a restart, an eviction). The default is
# deliberately far larger than any migration measured so far: a container whose
# migration *fails* still exits immediately (entrypoint.sh runs under `set -e`),
# so a wide budget only delays detecting a process that is alive but not
# serving, which is exactly what a running migration looks like.
# Note: a startup longer than the Deployment's default progressDeadlineSeconds
# (600s) marks the rollout failed even though the pod eventually comes up.
startupProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 360
  timeoutSeconds: 5

image:
  # -- Container image repository
  repository: ncsa/lumen
  # -- Image tag (defaults to chart appVersion)
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

## Application config ----------------------------------------------------------------

config:
  # -- Flask session signing key, a random string of at least 32 characters. REQUIRED unless existingSecret is set.
  secretKey: ""
  # -- API-key hashing and credential-encryption secret, a different random string of at least 32 characters. REQUIRED unless existingSecret is set.
  encryptionKey: ""
  # -- Enable Flask debug mode (never true in production)
  debug: false
  # -- Enable stack-capturing DB/context diagnostics (pool checkout tracking and
  # app-context probes surfaced via /metrics/debug). Set false to remove the
  # per-request capture overhead.
  diagnostics: true
  # -- Application display name
  name: "Lumen"
  # -- Application tagline shown in the UI
  tagline: "Illuminating AI"
  # -- Announcement banner text (plain text or markdown)
  announcement: ""
  # -- List of admin email addresses
  admins: []
  # -- Allow editing config.yaml from the /admin/config UI. The chart manages
  # config.yaml from these values, so it defaults to false (read-only editor).
  configEditor: false
  # -- Global fallbacks for models and token pools.
  defaults:
    models:
      # -- Global acknowledgement message for needs_ack models without their own
      # ackMessage (replaces the old graylist default notice). Empty = none.
      ackMessage: ""
      # -- Global acknowledgement message for earlyAccess models. Empty = built-in default.
      earlyAccessMessage: ""
    tokens:
      # -- Fallback coin pool for entities with no UI-set limit and no group pool.
      max: 0
      refresh: 0
      starting: 0
  # -- SQLAlchemy connection pool tuning. The database URL itself is supplied
  # via the DATABASE_URL env var (see postgresql.* / existingSecret).
  # By default the pool is auto-sized from the server's max_connections, split
  # across workers x replicas (LUMEN_REPLICAS is set from replicaCount). Leave
  # poolSize/maxOverflow empty to auto-size; set them only to override (honoured
  # only if they fit within 80% of max_connections across all workers/replicas).
  # NOTE: auto-sizing assumes a fixed replicaCount. If you autoscale the pods
  # (HPA/KEDA), LUMEN_REPLICAS stays at the configured replicaCount, so scaling
  # beyond it would let combined connections exceed max_connections. When
  # autoscaling, set poolSize/maxOverflow (or maxConnections) explicitly, sized
  # for your maximum replica count.
  database:
    # -- Override persistent pool connections per process (empty = auto-size)
    poolSize: ""
    # -- Override burst connections above poolSize per process (empty = auto-size)
    maxOverflow: ""
    # -- Override the detected Postgres max_connections (empty = query the server)
    maxConnections: ""
    poolTimeout: 10
    poolRecycle: 1800
    # -- SQLAlchemy engine/pool log level (info, debug)
    logging: "info"
  # -- UI theme. Built-in options: default, illinois, uic, uis.
  # Set to a custom name to use a theme mounted via config.themes.
  theme: "default"
  # -- Map email domain suffixes to theme names, e.g. {"@uic.edu": "uic"}
  emailThemes: {}
  logs:
    # -- Log level: DEBUG, INFO, WARNING, ERROR
    level: "info"
    # -- Log werkzeug access lines
    access: false
    # -- Log per-endpoint model health check results
    model: false
  # -- Custom themes to mount. Each key is the theme name; pvc is the PVC claim name.
  # The PVC is mounted read-only at /app/themes/<name>/ and must contain
  # theme.yaml, templates/theme/, and optionally static/.
  # Example:
  #   themes:
  #     mycorp:
  #       pvc: mycorp-theme-pvc
  themes: {}
  rateLimiting:
    # -- Rate limit per user, e.g. "30 per minute"
    limit: "30 per minute"
  # -- Bounds on the calls Lumen makes to the upstream model endpoints. Without
  # these the OpenAI SDK defaults apply (600s timeout, 2 retries), so one stalled
  # backend can hold a worker thread for ~30 minutes.
  llm:
    # -- Seconds to establish the upstream connection
    connectTimeout: 5
    # -- For a streaming response this is the maximum gap BETWEEN CHUNKS, not the
    # total call duration: a 20-minute generation is fine as long as tokens keep
    # arriving. Sized for a reasoning model that goes quiet while thinking before
    # emitting its first content token.
    readTimeout: 300
    # -- NON-streaming calls have no chunks to pace them, so this bounds the
    # whole generation. Much larger than readTimeout on purpose: a long
    # completion or a large audio transcription legitimately takes minutes.
    requestTimeout: 600
    # -- Retries for non-streaming upstream calls. Streaming calls are never
    # retried: a retry restarts the whole generation while the first attempt may
    # still be draining upstream.
    maxRetries: 1
  # -- Raw YAML appended verbatim to config.yaml (for settings not covered by chart values)
  extraConfig: ""

## API ------------------------------------------------------------------------------
api:
  # -- Require model acknowledgement (needs_ack) for API requests. Set false to exempt the API.
  consent: true
  prometheus:
    # -- Expose /metrics in Prometheus format
    enabled: false
    # -- Bearer token required to scrape /metrics. Empty disables Prometheus (token is mandatory when enabled).
    token: ""
    # -- Separate, stronger bearer token for /metrics/debug (thread dumps and
    # deployment details). Empty means /metrics/debug uses the scrape token.
    debugToken: ""
    # -- Path for multi-worker metric aggregation (mount a shared volume here for multiple replicas)
    multiprocDir: ""
  monitoring:
    # -- Bearer token for the monitoring endpoint. Empty disables it.
    token: ""

## Prometheus Operator ServiceMonitor -----------------------------------------------

serviceMonitor:
  # -- Create a ServiceMonitor (Prometheus Operator CRD) scraping /metrics on every
  # pod. Requires the Prometheus Operator CRDs and api.prometheus.enabled=true.
  # NOTE: api.prometheus.token is not wired in as scrape auth — see the comment in
  # templates/servicemonitor.yaml — so /metrics will reject unauthenticated scrapes
  # until that is set up some other way.
  enabled: false
  # -- Scrape interval
  interval: "30s"
  # -- Scrape timeout
  scrapeTimeout: "10s"
## OAuth2 / OIDC --------------------------------------------------------------------

oauth2:
  # -- OIDC client ID. REQUIRED unless existingSecret is set.
  clientId: ""
  # -- OIDC client secret. REQUIRED unless existingSecret is set.
  clientSecret: ""
  # -- OIDC provider metadata URL. Defaults to CILogon; set to any OIDC provider.
  serverMetadataUrl: "https://cilogon.org/.well-known/openid-configuration"
  # -- OAuth2 redirect URI. Computed from ingress/gateway hostname when empty.
  redirectUri: ""
  scopes: "openid email profile org.cilogon.userinfo"
  # -- Extra parameters passed to the authorization redirect (e.g. idphint, skin)
  params: {}
  # -- Accept logins whose provider reports the email as unverified (email_verified=false). Off by default.
  allowUnverifiedEmail: false

# -- Name of a pre-existing Secret containing app credentials.
# Must have keys: secret-key, encryption-key, oauth2-client-id, oauth2-client-secret.
# Optionally also: database-url, redis-url.
existingSecret: ""

## PostgreSQL -----------------------------------------------------------------------

postgresql:
  # -- Deploy bundled PostgreSQL. Uses TimescaleDB to match production.
  enabled: true
  # -- External PostgreSQL URL when postgresql.enabled=false. e.g. postgresql://user:pass@host:5432/db
  url: ""
  # -- Existing Secret containing the database URL instead of postgresql.url
  existingSecret: ""
  existingSecretKey: "database-url"
  # -- Container image. Defaults to timescaledb pg17; override to plain postgres:17-alpine if TimescaleDB is not needed.
  image: "timescale/timescaledb:2.27.2-pg17"
  auth:
    username: lumen
    password: ""
    database: lumen
    # -- Existing Secret with key "postgres-password". Skips chart-managed postgresql Secret.
    existingSecret: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 2
      memory: 2Gi

## Redis ----------------------------------------------------------------------------

redis:
  # -- Deploy bundled Redis.
  # When false and no redis.url is set, rate limiting falls back to in-memory.
  enabled: false
  # -- Container image. Pin to a specific patch version for production.
  image: "redis:7.4-alpine"
  # -- External Redis URL when redis.enabled=false. e.g. redis://:password@host:6379/0
  url: ""
  # -- Existing Secret containing the redis URL instead of redis.url
  existingSecret: ""
  existingSecretKey: "redis-url"
  port: 6379
  auth:
    enabled: false
    password: ""
    # -- Existing Secret with key "redis-password". Skips chart-managed redis Secret.
    existingSecret: ""
  persistence:
    # -- Enable a PVC for Redis data. When false, data is lost on pod restart.
    # Required when replicaCount > 1 to avoid split-brain rate-limit state.
    enabled: false
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

## Kubernetes service ---------------------------------------------------------------

service:
  type: ClusterIP
  port: 5001

## Ingress (standard Kubernetes Ingress) -------------------------------------------

ingress:
  # -- Enable standard Ingress
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
  #  - secretName: lumen-tls
  #    hosts:
  #      - lumen.example.com

## Gateway API (HTTPRoute for Traefik or other Gateway API implementations) ---------

gateway:
  # -- Enable Gateway API HTTPRoute
  enabled: false
  parentRef:
    name: traefik-gateway
    namespace: traefik-system
  hostname: ""
  # -- Request timeout for LLM responses
  timeout: "600s"

