## Models ---------------------------------------------------------------------------
## Copied verbatim into the `models:` section of config.yaml, so use the app's
## config format (snake_case keys, see config.yaml.example). The chart does not
## deploy inference servers; run them separately and point `endpoints` at them.
## A model removed from this list is disabled in Lumen, not deleted.

