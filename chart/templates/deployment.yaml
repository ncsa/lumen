apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumen.fullname" . }}
  labels:
    {{- include "lumen.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lumen.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config-secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "lumen.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "lumen.podSpecCommon" . | trim | nindent 6 }}
      initContainers:
        {{- include "lumen.waitForDbInitContainer" . | nindent 8 }}
        # Holds the pod until the database is at the migration head this image
        # expects. The migration Job (migrate-job.yaml) gets it there; this
        # container only reads, and with no --timeout it waits as long as that
        # takes. It runs through the image's entrypoint (no `command`), whose
        # wait-for-migrations mode also sets a default PGCONNECT_TIMEOUT.
        - name: wait-for-migrations
          securityContext:
            {{- include "lumen.appSecurityContext" . | nindent 12 }}
          image: {{ include "lumen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - wait-for-migrations
          env:
            {{- include "lumen.appEnv" . | nindent 12 }}
          resources:
            {{- include "lumen.appResources" . | nindent 12 }}
          volumeMounts:
            {{- include "lumen.appVolumeMounts" . | nindent 12 }}
      containers:
        - name: lumen
          securityContext:
            {{- include "lumen.appSecurityContext" . | nindent 12 }}
          image: {{ include "lumen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if gt (int .Values.wsgiProcesses) 1 }}
          args:
            - "--workers"
            - {{ .Values.wsgiProcesses | quote }}
          {{- end }}
          env:
            {{- include "lumen.appEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          # Covers uvicorn startup only: the database is already at head when the
          # container starts (wait-for-migrations above). See values.yaml.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            {{- include "lumen.appResources" . | nindent 12 }}
          volumeMounts:
            {{- include "lumen.appVolumeMounts" . | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "lumen.fullname" . }}-config
        {{- range $name, $theme := .Values.config.themes }}
        - name: theme-{{ $name }}
          persistentVolumeClaim:
            claimName: {{ $theme.pvc }}
        {{- end }}
        {{- if and .Values.api.prometheus.enabled .Values.api.prometheus.multiprocDir }}
        # Mounted whenever Prometheus is enabled AND multiprocDir is configured, not
        # only when wsgiProcesses > 1: prometheus_client enters multiprocess mode as
        # soon as PROMETHEUS_MULTIPROC_DIR is set (lumen/__init__.py setdefaults it
        # from config independently of the process count) and raises if the directory
        # does not exist. Env var set must imply directory present.
        - name: prometheus-multiproc
          emptyDir: {}
        {{- end }}
