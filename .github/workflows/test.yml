name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Linting lives in .github/workflows/lint.yml so a lint failure never stops
  # the tests from reporting.
  test:
    name: Tests (${{ matrix.name }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    # Experimental legs may fail without failing the workflow; their job still
    # shows red in the run.
    continue-on-error: ${{ matrix.experimental }}
    env:
      # uv sync / uv run use the matrix interpreter, not the newest one
      # requires-python allows.
      UV_PYTHON: ${{ matrix.python }}

    # scripts/monitor has its own pyproject.toml and uv.lock, so each project
    # runs its own suite against its own database image.
    #
    # One leg per project and Python version:
    #   image: true        the version the project's Dockerfile ships; the
    #                      "Check Dockerfile Python" step keeps the two in step.
    #   experimental: true allowed to fail; publishes no pytest check.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to the production version, not `latest-pg17`. A floating tag
          # adopts semantic changes silently, and this schema is sensitive to
          # exactly that class of change: 2.13 flipped the default of
          # `timescaledb.materialized_only` to true, which decides whether a
          # continuous aggregate returns the current bucket at all. Bump this
          # deliberately (in both lumen legs), in step with the deployment.
          - name: lumen
            path: .
            postgres: timescale/timescaledb:2.31.0-pg17
            python: "3.14"
            image: true
            experimental: false
          # Fails at `uv sync` until Lumen lifts its requires-python <3.15 cap.
          - name: lumen
            path: .
            postgres: timescale/timescaledb:2.31.0-pg17
            python: "3.15"
            image: false
            experimental: true
          - name: monitor
            path: scripts/monitor
            postgres: postgres:17
            python: "3.13"
            image: true
            experimental: false
          - name: monitor
            path: scripts/monitor
            postgres: postgres:17
            python: "3.15"
            image: false
            experimental: true
    defaults:
      run:
        working-directory: ${{ matrix.path }}

    # Lumen's suite is otherwise SQLite-only, which never runs Alembic and so
    # never exercises the request_logs hypertable, its continuous aggregate, or
    # any of the /api/usage/* SQL. Tests marked `postgres` skip when
    # LUMEN_TEST_POSTGRES_URL / MONITOR_TEST_POSTGRES_URL is absent.
    # Throwaway database that lives only for this job; never point these
    # credentials at a real instance.
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # Lumen's Redis live-state tests skip when this is absent.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # The image leg must test the Python the project's Dockerfile ships.
      - name: Check Dockerfile Python
        if: matrix.image
        run: grep -q "^FROM python:${{ matrix.python }}-slim" Dockerfile

      # The monitor dashboard's page JS tests (tests/js) run with Node under pytest.
      - name: Set up Node
        if: matrix.name == 'monitor'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # tests/unit/test_chart_migration.py renders the chart and fails without helm.
      - name: Install Helm
        if: matrix.name == 'lumen'
        uses: azure/setup-helm@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -rs --junitxml=junit.xml
        env:
          LUMEN_TEST_POSTGRES_URL: postgresql://ci:ci@localhost:5432/ci
          LUMEN_TEST_REDIS_URL: redis://localhost:6379/0
          MONITOR_TEST_POSTGRES_URL: postgresql://ci:ci@localhost:5432/ci

      # Skipped on experimental legs: the reporter creates its own check run,
      # which continue-on-error does not cover. Their job log keeps the failures.
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always() && !matrix.experimental
        with:
          name: pytest (${{ matrix.name }}, py${{ matrix.python }})
          path: ${{ matrix.path }}/junit.xml
          reporter: java-junit
