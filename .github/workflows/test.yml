name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Linting lives in .github/workflows/lint.yml so a lint failure never stops
  # the tests from reporting.
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    # The suite is otherwise SQLite-only, which never runs Alembic and so never
    # exercises the request_logs hypertable, its continuous aggregate, or any of
    # the /api/usage/* SQL. Tests marked `postgres` skip when this is absent.
    services:
      timescaledb:
        # Pinned to the production version, not `latest-pg17`. A floating tag
        # adopts semantic changes silently, and this schema is sensitive to
        # exactly that class of change: 2.13 flipped the default of
        # `timescaledb.materialized_only` to true, which decides whether a
        # continuous aggregate returns the current bucket at all. Bump this
        # deliberately, in step with the deployment.
        image: timescale/timescaledb:2.27.2-pg17
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --junitxml=junit.xml
        env:
          LUMEN_TEST_POSTGRES_URL: postgresql://lumen:lumen@localhost:5432/lumen_ci

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: pytest
          path: junit.xml
          reporter: java-junit
