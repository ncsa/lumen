name: Lint

on:
  push:
    branches:
      - main
  pull_request:

# Each linter is its own job so one failure does not hide the others, and so a
# red linter never stops the test workflow from reporting.
jobs:
  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      # --output-format=github annotates the offending lines in the PR diff.
      - name: Ruff
        run: uv run ruff check --output-format=github

  yaml:
    name: YAML (yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      # Config is .yamllint.yml; Helm templates are excluded there and covered
      # by the helm job below.
      - name: Yamllint
        run: uv run yamllint --format github .

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Lints Chart.yaml, values.schema.json, and renders every template.
      - name: Helm lint
        run: helm lint chart
