name: Lint

on:
  push:
    branches:
      - main
  pull_request:

# Each linter is its own job so one failure does not hide the others, and so a
# red linter never stops the test workflow from reporting.
jobs:
  python:
    name: Python (ruff, ${{ matrix.project.name }})
    runs-on: ubuntu-latest
    # scripts/monitor has its own pyproject.toml and uv.lock, so each project
    # lints with its own ruff config; the root config excludes scripts/monitor.
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: lumen
            path: .
          - name: monitor
            path: scripts/monitor
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ${{ matrix.project.path }}/pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      # --output-format=github annotates the offending lines in the PR diff.
      - name: Ruff
        run: uv run ruff check --output-format=github

  yaml:
    name: YAML (yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      # Config is .yamllint.yml; Helm templates are excluded there and covered
      # by the helm job below.
      - name: Yamllint
        run: uv run yamllint --format github .

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Lints Chart.yaml, values.schema.json, and renders every template.
      - name: Helm lint
        run: helm lint chart

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      # The gitleaks CLI is used directly: gitleaks/gitleaks-action needs a paid
      # license for organization repos. Bump both values together.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the PR scan can diff against the base branch.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}" gitleaks
          rm gitleaks.tar.gz

      # Config is .gitleaks.toml (default rules plus placeholder allowlist).
      - name: Scan working tree
        run: ${RUNNER_TEMP}/gitleaks detect --source . --no-git --redact --exit-code 1

      # Only the PR's own commits: full history still holds a rotated key.
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          ${RUNNER_TEMP}/gitleaks detect --redact --exit-code 1
          --log-opts="origin/${{ github.base_ref }}..HEAD"
