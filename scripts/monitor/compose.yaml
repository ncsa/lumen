# Example: the monitor and its own PostgreSQL database.
#   cp config.yaml.example config.yaml   # then edit: lumen.url, price, models
#   MONITOR_LUMEN_API_KEY=... docker compose -f scripts/monitor/compose.yaml up -d --build
# The dashboard has no login: keep port 5002 on an internal network or behind the reverse proxy.
# Run a single replica; two would double-write probes and double-count totals.
services:
  monitor:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Overrides database_url in config.yaml.
      MONITOR_DATABASE_URL: postgresql://monitor:${MONITOR_DB_PASSWORD:-monitor}@postgres/monitor
      # Overrides lumen.api_key; empty keeps the value from config.yaml.
      MONITOR_LUMEN_API_KEY: ${MONITOR_LUMEN_API_KEY:-}
      # Uncomment when served under a prefix by the reverse proxy (overrides base_path).
      # MONITOR_BASE_PATH: /monitor
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:5002:5002"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${MONITOR_DB_PASSWORD:-monitor}
      POSTGRES_DB: monitor
    volumes:
      - monitor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  monitor-db:
