[project]
name = "lumen"
version = "1.26.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "openai>=3",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "authlib>=1.3",
    "requests>=2.31",
    "uvicorn>=0.30",
    "a2wsgi>=1.10",
    "flask-limiter[redis]>=4",
    "prometheus_client>=0.20",
    "pypdf>=6",
    "filetype>=1.2",
    "markdown>=3.6",
    "flask-wtf>=1.2",
    "bleach>=6.0",
    "psutil>=7",
]

[project.scripts]
lumen = "run:main"
dummy = "loadtesting.dummy_backend:main"
locust = "loadtesting.runner:main"

[dependency-groups]
dev = [
    "locust>=2.28",
    "pytest>=9",
    "pytest-flask>=1.3",
    "pytest-cov>=7",
    "pytest-timeout>=2.4",
    "beautifulsoup4>=4.12",
    "playwright>=1.59.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lumen --cov-report=term-missing -q"
# Backstop only. The full suite runs in ~50s, so this never fires normally; it
# exists so a test that hangs (a blocked socket read, a server that never shuts
# down) fails with a stack trace naming the culprit instead of stalling CI.
# Individual tests still carry their own, tighter guards.
timeout = 300
markers = [
    "postgres: needs a real PostgreSQL + TimescaleDB (set LUMEN_TEST_POSTGRES_URL; skipped otherwise)",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
