[project]
name = "lumen"
version = "1.25.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "openai>=3",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "authlib>=1.3",
    "requests>=2.31",
    "uvicorn>=0.30",
    "a2wsgi>=1.10",
    "flask-limiter[redis]>=4",
    "prometheus_client>=0.20",
    "pypdf>=6",
    "filetype>=1.2",
    "markdown>=3.6",
    "flask-wtf>=1.2",
    "bleach>=6.0",
    "psutil>=7",
]

[project.scripts]
lumen = "run:main"
dummy = "loadtesting.dummy_backend:main"
locust = "loadtesting.runner:main"

[dependency-groups]
dev = [
    "locust>=2.28",
    "pytest>=9",
    "pytest-flask>=1.3",
    "pytest-cov>=7",
    "beautifulsoup4>=4.12",
    "playwright>=1.59.0",
    "ruff>=0.14",
    "yamllint>=1.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lumen --cov-report=term-missing -q"

[tool.ruff]
target-version = "py311"
# Alembic revisions are generated from a template that imports sa/op whether or
# not the revision uses them, and they are never edited after review.
extend-exclude = ["migrations/versions"]
# Only used by `ruff format`; E501 is deliberately not enforced (see below).
line-length = 160

[tool.ruff.lint]
# Ruff's recommended default (pycodestyle errors + pyflakes) plus import sorting
# and pycodestyle warnings. Deliberately NOT enabled:
#   E501  - the codebase uses long single-line column definitions with comments.
#   DTZ   - it demands timezone-aware datetimes; Lumen stores naive UTC on purpose
#           (see CLAUDE.md) and gets "now" from lumen.timeutils.utcnow().
#   UP017 - would rewrite timezone.utc to datetime.UTC, same naive-UTC concern.
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy relationships use string forward references, e.g. Mapped["Entity"],
# which the registry resolves at runtime; ruff sees an undefined name.
"lumen/models/*.py" = ["F821"]
# The app factory imports blueprints and services inside create_app on purpose,
# to break import cycles (see CLAUDE.md).
"lumen/__init__.py" = ["E402"]
# load_dotenv() must run before `from lumen import create_app`, which reads the
# environment while building the app config.
"asgi.py" = ["E402"]
# The load-test harness keeps timing/token locals around for ad-hoc debugging
# even when the current scenario does not report them.
"loadtesting/*.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["lumen"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
