# Local development config (v2) — no OAuth, no Postgres, no real LLM.
#
#   uv run dummy                              # echo backend on :9999 (separate terminal)
#   CONFIG_YAML=./dev.config.yaml uv run flask db upgrade
#   CONFIG_YAML=./dev.config.yaml uv run lumen
#
# Then open http://localhost:5001 — you're auto-logged in as the dev_user (an admin),
# so /admin/config is reachable to exercise the config editor.

version: 3

app:
  name: Lumen (dev)
  debug: true
  secret_key: dev-secret-not-for-production
  encryption_key: dev-encryption-not-for-production
  database:
    url: sqlite:///lumen_dev.db
  logs:
    level: info
  # Bypasses OAuth: every visit logs in as this user. Added to `admins` below so the
  # config editor is reachable. dev_user groups are applied at login; names that
  # don't match an existing group are ignored.
  dev_user:
    email: dev@example.com
    groups:
    - staff
    - granite-testers

admins:
- dev@example.com

rate_limiting:
  limit: 200 per minute

# Global fallbacks. Token pool falls back here when no group/user sets one.
# Model visibility is ownership-based: a model with no owner is available to everyone;
# owners and group grants are managed on the model's detail page, not in this file.
defaults:
  models:
    ack_message: This model was trained outside the U.S. and may contain biases — use with awareness.
  tokens:
    max: 50
    refresh: 0.1
    starting: 50

# DEPRECATED: auto-join rules live in the database and are edited on each
# group's page (admin-only Rules tab). This section is imported into the
# database once by the upgrade migration and ignored afterwards (a startup
# warning nags until it is removed). Dev note: the SQLite dev flow
# (create_all + stamp) skips migrations, so create dev groups in the UI.
group_rules:
  staff:
  - field: affiliation
    contains: staff@example.edu
  students:
  - field: affiliation
    contains: student@example.edu
  # A small group to grant owned models to; add it to a model on its detail page.
  granite-testers: []

models:
# The only model with a live backend (uv run dummy). No owner -> available to everyone.
- name: dummy
  description: Local echo backend for development.
  input_cost_per_million: 0
  output_cost_per_million: 0
  endpoints:
  - url: http://localhost:9999/v1
    api_key: dummy
    model: dummy

# Also wired to the echo backend so it works in chat; requires acknowledgement.
- name: vision-beta
  description: Demo model that requires acknowledgement before use.
  needs_ack: true
  input_cost_per_million: 0.1
  output_cost_per_million: 0.2
  input_modalities: [text, image]
  output_modalities: [text]
  endpoints:
  - url: http://localhost:9999/v1
    api_key: dummy
    model: dummy

# Candidate for ownership testing: set an owner on its detail page, then grant granite-testers.
- name: granite-speech
  description: Test model for ownership and group grants.
  input_cost_per_million: 0.1
  output_cost_per_million: 0.2
  endpoints:
  - url: http://localhost:9999/v1
    api_key: dummy
    model: dummy

# Disabled — hidden everywhere.
- name: retired-model
  disabled: true
  input_cost_per_million: 0
  output_cost_per_million: 0
  endpoints:
  - url: http://localhost:9999/v1
    api_key: dummy
    model: dummy

# A handful of extra (offline) models so the editor's search box has something to find.
- name: model-a
  input_cost_per_million: 0.1
  output_cost_per_million: 0.2
  endpoints:
  - url: http://localhost:8101/v1
    api_key: x
    model: model-a
- name: model-b
  input_cost_per_million: 0.1
  output_cost_per_million: 0.2
  endpoints:
  - url: http://localhost:8102/v1
    api_key: x
    model: model-b
- name: model-c
  input_cost_per_million: 0.1
  output_cost_per_million: 0.2
  endpoints:
  - url: http://localhost:8103/v1
    api_key: x
    model: model-c
